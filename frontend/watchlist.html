<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoMind | Watchlist</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <script>document.body.classList.toggle('theme-light', localStorage.getItem('alphamind_theme') !== 'dark');</script>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark"><img src="/images/algomind-mark.svg" alt="" aria-hidden="true"></div>
          <h1>AlgoMind</h1>
        </div>
        <ul class="sidebar-nav">
          <li class="nav-item" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</li>
          <li class="nav-item" data-page="market"><i class="fa-solid fa-chart-column"></i> Market Data</li>
          <li class="nav-item" data-page="signals"><i class="fa-solid fa-bolt"></i> Trade Signals</li>
          <li class="nav-item" data-page="strategies"><i class="fa-solid fa-diagram-project"></i> Strategies</li>
          <li class="nav-item" data-page="portfolio"><i class="fa-solid fa-wallet"></i> Portfolio</li>
          <li class="nav-item" data-page="backtesting"><i class="fa-solid fa-flask-vial"></i> Backtesting</li>
          <li class="nav-item" data-page="reports"><i class="fa-solid fa-file-lines"></i> Reports</li>
          <li class="nav-item active"><i class="fa-solid fa-star"></i> Watchlist</li>
          <li class="nav-item" data-page="alerts"><i class="fa-solid fa-bell"></i> Alerts</li>
          <li class="nav-item" data-page="profile"><i class="fa-solid fa-user"></i> Profile Settings</li>
          <li class="nav-item logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" id="menu-toggle"><i class="fa fa-bars"></i></button>
            <span class="page-title">Watchlist</span>
          </div>
          <div class="topbar-right">
            <button class="icon-button"><i class="fa-solid fa-bell"></i><span class="badge">2</span></button>
            <div class="user-chip">
              <div class="avatar" id="user-avatar">V</div>
              <div>
                <div class="user-name" id="top-user-name">Investor</div>
              </div>
            </div>
          </div>
        </header>

        <div class="content-grid">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Find an instrument</div>
              <div class="instrument-search-controls">
                <div class="instrument-search">
                  <input id="instrument-search" type="text" placeholder="Company name or symbol" autocomplete="off" />
                  <div id="instrument-suggestions" class="suggestion-list" hidden></div>
                </div>
                <input id="exchange-filter" type="text" placeholder="Exchange (optional)" aria-label="Filter by exchange" />
              </div>
            </div>
            <section id="instrument-details" class="instrument-details" hidden></section>
          </section>
          <section class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">Tracked Securities</div>
                <div id="watchlist-status" class="market-data-status" role="status"></div>
              </div>
            </div>
            <table class="portfolio-table">
              <thead>
                <tr><th>Symbol</th><th>Name</th><th>Exchange</th><th>Price</th><th>Change</th><th>Action</th></tr>
              </thead>
              <tbody id="watchlist-body"><tr><td colspan="6" class="empty-state">Loading watchlist...</td></tr></tbody>
            </table>
          </section>
        </div>
      </main>
    </div>

    <script src="/js/stock-logo.js"></script>
    <script src="/js/api.js"></script>
    <script>
      const user = parseUser();
      const watchlistBody = document.getElementById('watchlist-body');
      const searchInput = document.getElementById('instrument-search');
      const exchangeInput = document.getElementById('exchange-filter');
      const suggestions = document.getElementById('instrument-suggestions');
      const detailsPanel = document.getElementById('instrument-details');
      const watchlistStatus = document.getElementById('watchlist-status');
      let suggestionTimer;
      if (user) {
        document.getElementById('top-user-name').textContent = user.full_name || user.username;
        document.getElementById('user-avatar').textContent = (user.full_name || user.username || 'V').charAt(0).toUpperCase();
      }
      document.getElementById('logout-btn').addEventListener('click', logoutUser);
      document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
      bindSidebarNavigation();

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }

      async function loadWatchlist() {
        try {
          const result = await apiRequest('/api/watchlist');
          const items = result.data || [];
          watchlistStatus.textContent = `${items.length} tracked instruments.`;
          watchlistBody.innerHTML = items.length ? items.map((item) => `
            <tr>
              <td><span class="stock-name-with-logo">${stockLogoMarkup(item.symbol, item.name)}${escapeHtml(item.symbol)}</span></td><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.exchange)}</td>
              <td>${item.price == null ? '--' : formatCurrency(item.price)}</td>
              <td class="${item.change == null ? 'muted' : item.change >= 0 ? 'positive' : 'negative'}">${item.change == null ? '--' : `${item.change >= 0 ? '+' : ''}${Number(item.change).toFixed(2)}%`}</td>
              <td><button class="secondary-btn" data-remove="${escapeHtml(item.watchlist_id)}" title="Remove from watchlist"><i class="fa-solid fa-trash"></i></button></td>
            </tr>
          `).join('') : '<tr><td colspan="6" class="empty-state">Your watchlist is empty.</td></tr>';
        } catch (error) {
          if (error.message.includes('Authorization')) {
            logoutUser();
            return;
          }
          watchlistStatus.textContent = error.message;
          watchlistBody.innerHTML = `<tr><td colspan="6" class="empty-state">${escapeHtml(error.message)}</td></tr>`;
        }
      }

      async function searchInstruments() {
        const query = searchInput.value.trim();
        if (!query) {
          suggestions.hidden = true;
          return;
        }
        try {
          const params = new URLSearchParams({ q: query, exchange: exchangeInput.value.trim() });
          const result = await apiRequest(`/api/instruments/search?${params}`);
          suggestions.innerHTML = (result.data || []).map((instrument) => `
            <button class="suggestion-item" data-detail="${escapeHtml(instrument.symbol)}" data-exchange="${escapeHtml(instrument.exchange)}">
              <span class="suggestion-symbol">${stockLogoMarkup(instrument.symbol, instrument.name)}<strong>${escapeHtml(instrument.symbol)}</strong></span><span>${escapeHtml(instrument.name)}</span><small>${escapeHtml(instrument.exchange)}</small>
            </button>
          `).join('') || '<div class="suggestion-empty">No instruments found</div>';
          suggestions.hidden = false;
        } catch (error) {
          if (error.message.includes('Authorization')) {
            logoutUser();
            return;
          }
          watchlistStatus.textContent = error.message;
          suggestions.hidden = true;
        }
      }

      async function showDetails(symbol, exchange) {
        const params = new URLSearchParams({ exchange });
        const result = await apiRequest(`/api/instruments/${encodeURIComponent(symbol)}?${params}`);
        const instrument = result.data;
        detailsPanel.innerHTML = `
          <div><div class="instrument-detail-heading stock-name-with-logo">${stockLogoMarkup(instrument.symbol, instrument.name)}${escapeHtml(instrument.name)}</div><div class="muted">${escapeHtml(instrument.symbol)} · ${escapeHtml(instrument.exchange)} · ${escapeHtml(instrument.instrument_type || 'EQUITY')}</div></div>
          <div class="instrument-detail-metrics"><span>Price<strong>${formatCurrency(instrument.price)}</strong></span><span>Change<strong class="${instrument.change >= 0 ? 'positive' : 'negative'}">${instrument.change >= 0 ? '+' : ''}${Number(instrument.change).toFixed(2)}%</strong></span><span>Sector<strong>${escapeHtml(instrument.sector || '—')}</strong></span></div>
          <button class="secondary-btn" data-add="${escapeHtml(instrument.symbol)}" data-exchange="${escapeHtml(instrument.exchange)}"><i class="fa-solid fa-star"></i> Add to Watchlist</button>
        `;
        detailsPanel.hidden = false;
        suggestions.hidden = true;
      }

      document.addEventListener('click', async (event) => {
        const detailButton = event.target.closest('[data-detail]');
        const addButton = event.target.closest('[data-add]');
        const removeButton = event.target.closest('[data-remove]');
        if (detailButton) {
          try { await showDetails(detailButton.dataset.detail, detailButton.dataset.exchange); } catch (error) { window.alert(error.message); }
        } else if (addButton) {
          try {
            await apiRequest('/api/watchlist', { method: 'POST', body: JSON.stringify({ symbol: addButton.dataset.add, exchange: addButton.dataset.exchange }) });
            await loadWatchlist();
            window.alert(`${addButton.dataset.add} added to watchlist`);
          } catch (error) { window.alert(error.message); }
        } else if (removeButton) {
          try {
            await apiRequest(`/api/watchlist/${encodeURIComponent(removeButton.dataset.remove)}`, { method: 'DELETE' });
            await loadWatchlist();
          } catch (error) { window.alert(error.message); }
        } else if (!event.target.closest('.instrument-search')) {
          suggestions.hidden = true;
        }
      });

      searchInput.addEventListener('input', () => {
        window.clearTimeout(suggestionTimer);
        suggestionTimer = window.setTimeout(searchInstruments, 200);
      });
      exchangeInput.addEventListener('input', () => {
        window.clearTimeout(suggestionTimer);
        suggestionTimer = window.setTimeout(searchInstruments, 200);
      });
      loadWatchlist();
    </script>
  </body>
</html>
