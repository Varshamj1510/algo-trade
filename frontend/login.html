<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoTrade | Login</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-shell">
        <div class="auth-visual">
          <div class="brand">
            <div class="brand-mark">AI</div>
            <div>
              <h1>AlgoTrade</h1>
            </div>
          </div>
          <div style="padding: 40px 10px 20px;">
            <p style="color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-size: 11px;">Algorithmic Trading System</p>
            <h2 style="font-size: 2.8rem; margin: 12px 0;">Smart Trades.<br />Better Tomorrow.</h2>
            <p style="color: var(--muted); max-width: 380px; line-height: 1.7;">Trade smarter with AI-powered market intelligence, statistical models, and realtime portfolio automation.</p>
          </div>
        </div>

        <div class="auth-card">
          <h2 class="auth-title">Welcome Back!</h2>
          <p class="auth-subtitle">Login to your account</p>

          <div id="login-alert"></div>

          <form id="login-form">
            <div class="form-group">
              <label for="login-email">Email or Username</label>
              <input id="login-email" name="email" type="text" placeholder="Enter your email or username" required />
            </div>

            <div class="form-group">
              <label for="login-password">Password</label>
              <div class="input-row">
                <input id="login-password" name="password" type="password" placeholder="Enter your password" required />
                <button type="button" class="toggle-password" data-target="login-password"><i class="fa fa-eye"></i></button>
              </div>
            </div>

            <div class="form-row">
              <label class="checkbox-row"><input type="checkbox" name="remember" /> Remember Me</label>
              <button type="button" class="link-btn">Forgot Password?</button>
            </div>

            <div class="form-group" style="margin-top: 18px;">
              <button type="submit" class="primary-btn">LOGIN</button>
            </div>
          </form>

          <div class="auth-footer">
            Don't have an account? <button type="button" class="link-btn" onclick="window.location.href='/register'">Register</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
      const alertBox = document.getElementById('login-alert');
      const form = document.getElementById('login-form');

      function showAlert(message, type = 'error') {
        alertBox.innerHTML = `<div class="alert ${type}">${message}</div>`;
      }

      document.querySelectorAll('.toggle-password').forEach((button) => {
        button.addEventListener('click', () => {
          const input = document.getElementById(button.dataset.target);
          const icon = button.querySelector('i');
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          icon.className = show ? 'fa fa-eye-slash' : 'fa fa-eye';
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value,
        };

        try {
          const data = await apiRequest('/api/auth/login', { method: 'POST', body: JSON.stringify(payload) });
          localStorage.setItem('algotrade_token', data.token);
          localStorage.setItem('algotrade_user', JSON.stringify(data.user));
          redirectTo('/dashboard');
        } catch (error) {
          showAlert(error.message, 'error');
        }
      });
    </script>
  </body>
</html>
