<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoTrade | Profile</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <h1>AlgoTrade</h1>
        </div>
        <ul class="sidebar-nav">
          <li class="nav-item" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</li>
          <li class="nav-item" data-page="market"><i class="fa-solid fa-chart-column"></i> Market Data</li>
          <li class="nav-item" data-page="signals"><i class="fa-solid fa-bolt"></i> Trade Signals</li>
          <li class="nav-item" data-page="strategies"><i class="fa-solid fa-diagram-project"></i> Strategies</li>
          <li class="nav-item" data-page="portfolio"><i class="fa-solid fa-wallet"></i> Portfolio</li>
          <li class="nav-item" data-page="backtesting"><i class="fa-solid fa-flask-vial"></i> Backtesting</li>
          <li class="nav-item" data-page="reports"><i class="fa-solid fa-file-lines"></i> Reports</li>
          <li class="nav-item" data-page="watchlist"><i class="fa-solid fa-star"></i> Watchlist</li>
          <li class="nav-item" data-page="alerts"><i class="fa-solid fa-bell"></i> Alerts</li>
          <li class="nav-item active"><i class="fa-solid fa-user"></i> Profile Settings</li>
          <li class="nav-item logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" id="menu-toggle"><i class="fa fa-bars"></i></button>
            <span class="page-title">Profile Settings</span>
          </div>
          <div class="topbar-right">
            <button class="icon-button"><i class="fa-solid fa-bell"></i><span class="badge">1</span></button>
            <div class="user-chip">
              <div class="avatar" id="user-avatar">V</div>
              <div>
                <div class="user-name" id="top-user-name">Investor</div>
                <div class="user-plan">Premium Plan</div>
              </div>
            </div>
          </div>
        </header>

        <div class="content-grid">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Account Details</div>
            </div>
            <form id="profile-form">
              <div class="form-group">
                <label for="profile-name">Full Name</label>
                <input id="profile-name" type="text" placeholder="Full Name" />
              </div>
              <div class="form-group">
                <label for="profile-email">Email</label>
                <input id="profile-email" type="email" placeholder="Email" />
              </div>
              <div class="form-group">
                <label for="profile-username">Username</label>
                <input id="profile-username" type="text" placeholder="Username" />
              </div>
              <div class="form-group">
                <button type="submit" class="primary-btn">Save Changes</button>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="/js/api.js"></script>
    <script>
      const user = parseUser();
      const profileForm = document.getElementById('profile-form');
      if (!requireAuth()) { throw new Error('Not authenticated'); }
      if (user) {
        document.getElementById('top-user-name').textContent = user.full_name || user.username;
        document.getElementById('user-avatar').textContent = (user.full_name || user.username || 'V').charAt(0).toUpperCase();
        document.getElementById('profile-name').value = user.full_name || '';
        document.getElementById('profile-email').value = user.email || '';
        document.getElementById('profile-username').value = user.username || '';
      }

      profileForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const payload = {
            full_name: document.getElementById('profile-name').value,
            email: document.getElementById('profile-email').value,
            username: document.getElementById('profile-username').value,
          };
          const response = await apiRequest('/api/profile', { method: 'PUT', body: JSON.stringify(payload) });
          localStorage.setItem('algotrade_user', JSON.stringify(response.user || { ...user, ...payload }));
          alert('Profile updated successfully.');
        } catch (error) {
          alert(error.message || 'Profile update failed.');
        }
      });

      document.getElementById('logout-btn').addEventListener('click', logoutUser);
      document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
      bindSidebarNavigation();
    </script>
  </body>
</html>
