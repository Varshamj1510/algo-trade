<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoTrade | Strategies</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <h1>AlgoTrade</h1>
        </div>
        <ul class="sidebar-nav">
          <li class="nav-item" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</li>
          <li class="nav-item" data-page="market"><i class="fa-solid fa-chart-column"></i> Market Data</li>
          <li class="nav-item" data-page="signals"><i class="fa-solid fa-bolt"></i> Trade Signals</li>
          <li class="nav-item active"><i class="fa-solid fa-diagram-project"></i> Strategies</li>
          <li class="nav-item" data-page="portfolio"><i class="fa-solid fa-wallet"></i> Portfolio</li>
          <li class="nav-item" data-page="backtesting"><i class="fa-solid fa-flask-vial"></i> Backtesting</li>
          <li class="nav-item" data-page="reports"><i class="fa-solid fa-file-lines"></i> Reports</li>
          <li class="nav-item" data-page="watchlist"><i class="fa-solid fa-star"></i> Watchlist</li>
          <li class="nav-item" data-page="alerts"><i class="fa-solid fa-bell"></i> Alerts</li>
          <li class="nav-item" data-page="profile"><i class="fa-solid fa-user"></i> Profile Settings</li>
          <li class="nav-item logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" id="menu-toggle"><i class="fa fa-bars"></i></button>
            <span class="page-title">Strategies</span>
          </div>
          <div class="topbar-right">
            <button class="icon-button"><i class="fa-solid fa-bell"></i><span class="badge">1</span></button>
            <div class="user-chip">
              <div class="avatar" id="user-avatar">V</div>
              <div>
                <div class="user-name" id="top-user-name">Investor</div>
                <div class="user-plan">Premium Plan</div>
              </div>
            </div>
          </div>
        </header>

        <div class="content-grid">
          <section class="panel">
            <div class="panel-header strategy-header">
              <div class="panel-title">Strategy Library</div>
              <button class="secondary-btn">+ New Strategy</button>
            </div>
            <div class="search-box" style="margin-bottom: 18px;">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="strategy-search" type="text" placeholder="Search strategy, stock, or signal reason" />
            </div>
            <div class="strategy-grid" id="strategy-grid"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="/js/api.js"></script>
    <script>
      const user = parseUser();
      if (!requireAuth()) { throw new Error('Not authenticated'); }
      if (user) {
        document.getElementById('top-user-name').textContent = user.full_name || user.username;
        document.getElementById('user-avatar').textContent = (user.full_name || user.username || 'V').charAt(0).toUpperCase();
      }

      const strategyCatalog = [
        {
          name: 'Moving Average / EMA',
          signal: 'BUY',
          score: 78,
          description: 'Short-term EMA crossing above long-term EMA indicates a bullish trend change and stronger momentum.',
          logic: 'BUY when the faster EMA moves above the slower EMA. SELL when the faster EMA falls below. HOLD when the trend is flat or noisy.'
        },
        {
          name: 'MACD',
          signal: 'BUY',
          score: 81,
          description: 'MACD line crossing above the signal line shows rising momentum and a possible continuation of the uptrend.',
          logic: 'BUY when MACD crosses above the signal line. SELL when MACD crosses below. HOLD when both lines are close and trend strength is weak.'
        },
        {
          name: 'RSI',
          signal: 'HOLD',
          score: 64,
          description: 'RSI measures momentum strength and identifies oversold or overbought zones for reversal trades.',
          logic: 'BUY below 30, SELL above 70, HOLD between 40 and 60 to avoid false breakouts.'
        },
        {
          name: 'VWAP',
          signal: 'BUY',
          score: 72,
          description: 'Price trading above VWAP often means institutional buying pressure and a healthy trend environment.',
          logic: 'BUY when price remains above VWAP and volume supports the move. SELL when price closes below VWAP.'
        },
        {
          name: 'Bollinger Bands',
          signal: 'SELL',
          score: 58,
          description: 'Bands widen or contract with volatility, helping identify breakout or reversal opportunities near the extreme bands.',
          logic: 'BUY near the lower band during strength, SELL near the upper band during exhaustion, HOLD in the middle range.'
        },
        {
          name: 'ATR',
          signal: 'HOLD',
          score: 61,
          description: 'ATR reflects volatility; it helps size risk and decide whether a move is likely to continue or fade.',
          logic: 'High ATR supports trend continuation; low ATR suggests sideways or weak movement, resulting in HOLD or tight risk management.'
        }
      ];

      let currentStrategyCards = [...strategyCatalog];

      function getSignalClass(signal) {
        const level = String(signal || '').toUpperCase();
        if (level === 'BUY') return 'buy';
        if (level === 'SELL') return 'sell';
        return 'hold';
      }

      function renderStrategyCards(cards) {
        const grid = document.getElementById('strategy-grid');
        const query = document.getElementById('strategy-search').value.trim().toLowerCase();
        const filtered = cards.filter((strategy) => {
          const haystack = `${strategy.name} ${strategy.description} ${strategy.logic} ${strategy.signal}`.toLowerCase();
          return haystack.includes(query);
        });

        if (!filtered.length) {
          grid.innerHTML = '<div class="empty-state">No strategy match for your search.</div>';
          return;
        }

        grid.innerHTML = filtered.map((strategy) => `
          <article class="strategy-card">
            <div class="strategy-head">
              <div>
                <div class="strategy-name">${strategy.name}</div>
                <div class="strategy-subtitle">Technical indicator logic</div>
              </div>
              <span class="decision-pill ${getSignalClass(strategy.signal)}">${strategy.signal}</span>
            </div>
            <div class="strategy-score">${strategy.score}% confidence</div>
            <p>${strategy.description}</p>
            <div class="strategy-logic">
              <strong>Why this signal:</strong>
              <span>${strategy.logic}</span>
            </div>
          </article>
        `).join('');
      }

      async function loadStrategies() {
        try {
          const data = await apiRequest('/api/strategies');
          const cards = (data.data || []).length ? data.data.map((item, index) => ({
            ...strategyCatalog[index % strategyCatalog.length],
            name: item.name || strategyCatalog[index % strategyCatalog.length].name,
            score: Number(item.win_rate || strategyCatalog[index % strategyCatalog.length].score),
            description: item.description || strategyCatalog[index % strategyCatalog.length].description,
            signal: item.status === 'Paused' ? 'HOLD' : (index % 2 === 0 ? 'BUY' : 'SELL'),
            logic: strategyCatalog[index % strategyCatalog.length].logic,
          })) : strategyCatalog;

          currentStrategyCards = cards;
          renderStrategyCards(currentStrategyCards);
        } catch (error) {
          if (error.message.includes('Authorization')) {
            logoutUser();
            return;
          }
          currentStrategyCards = [...strategyCatalog];
          renderStrategyCards(currentStrategyCards);
        }
      }

      document.getElementById('logout-btn').addEventListener('click', logoutUser);
      document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
      document.getElementById('strategy-search').addEventListener('input', () => renderStrategyCards(currentStrategyCards));
      bindSidebarNavigation();
      loadStrategies();
      setInterval(loadStrategies, 10000);
    </script>
  </body>
</html>
